[package]
name = "pqaudit"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "TLS post-quantum readiness auditor"
repository = "https://github.com/YasogaN/pqaudit"
homepage = "https://github.com/YasogaN/pqaudit"
documentation = "https://docs.rs/pqaudit"
readme = "README.md"
keywords = ["tls", "post-quantum", "pqc", "security", "scanner"]
categories = [
    "command-line-utilities",
    "network-programming",
    "cryptography",
    "development-tools",
]
exclude = [
    ".github/**",
    "docs/**",
    "examples/**",
    "skills/**",
    "action.yml",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
]

[[bin]]
name = "pqaudit"
path = "src/main.rs"

[lib]
name = "pqaudit"
path = "src/lib.rs"

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:schemars"]
live-tests = []

[dependencies]
rustls = { version = "0.23.37", features = ["aws_lc_rs", "prefer-post-quantum", "tls12"], default-features = false }
aws-lc-rs = "1.16.1"
tokio = { version = "1.50.0", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs"] }
clap = { version = "4.6.0", features = ["derive"] }
x509-parser = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
owo-colors = "4.3.0"
indicatif = "0.18.4"
futures = "0.3"
webpki-roots = "1.0"
rmcp = { version = "3.11.0", features = ["transport-io"], optional = true }
schemars = { version = "1.0", optional = true }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.4"
tokio = { version = "1.50.0", features = ["full", "test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tempfile = "3"
